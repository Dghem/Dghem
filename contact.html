<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dghem | Contact</title>
    <meta name="description" content="Get in touch with Dghem — reach out on Discord for project inquiries.">

    <!-- Open Graph / Link Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dghem | Contact">
    <meta property="og:description" content="Get in touch with Dghem — reach out on Discord for project inquiries.">
    <meta property="og:image" content="https://dghem.site/og-image.png">
    <meta property="og:url" content="https://dghem.site/contact">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dghem | Contact">
    <meta name="twitter:description" content="Get in touch with Dghem — reach out on Discord for project inquiries.">
    <meta name="twitter:image" content="https://dghem.site/og-image.png">

    <!-- Discord Blue Side Bar -->
    <meta name="theme-color" content="#00bfff">

    <link rel="icon" href="https://i.ibb.co/pv9NJ9TB/59bac9e8-fed2-40f2-8262-33878be50a67.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Custom Cursor -->
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <canvas class="cursor-glow-canvas" id="cursorGlowCanvas"></canvas>

    <!-- Page Transition Overlay -->
    <div class="page-transition" id="pageTransition">
        <div class="page-transition-inner"></div>
    </div>

    <div class="loader" id="loader">
        <!-- Animated particle canvas -->
        <canvas class="loader-particles" id="loaderParticles"></canvas>

        <!-- Center content -->
        <div class="loader-center">
            <div class="loader-text-logo">
                <span class="bracket bracket-left">&lt;</span>
                <span class="bracket bracket-slash">/</span>
                <img src="https://i.ibb.co/XfPqSFY8/1.png" alt="Dghem" class="signature-gif-like">
                <span class="bracket bracket-right">&gt;</span>
            </div>
            <div class="loader-glow"></div>
            
            <!-- Cinematic Progress Bar -->
            <div class="loader-progress-container">
                <div class="loader-progress-bar" id="loaderProgressBar"></div>
            </div>
        </div>

        <!-- Scan line -->
        <div class="loader-scan"></div>
    </div>

    <div class="vignette"></div>

    <!-- ═══════════════════════════════════════
         HEADER
         ═══════════════════════════════════════ -->
    <header class="header" id="header">
        <a href="index.html" class="header-logo">
            <img src="https://i.ibb.co/XfPqSFY8/1.png" alt="Dghem">
        </a>

        <nav class="nav" id="nav">
            <a href="index.html" class="nav-link">Portfolio</a>
            <a href="index.html#projects" class="nav-link">Projects</a>
            <a href="contact.html" class="nav-link active">Contact</a>
        </nav>

        <div class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- ═══════════════════════════════════════
         CONTACT
         ═══════════════════════════════════════ -->
    <section class="contact-section">
        <div class="contact-container">
            <div class="contact-card">
                <i class="fab fa-discord contact-icon"></i>
                <h1 class="contact-title">Contact Me on Discord</h1>
                <p class="contact-text">
                    You can reach me directly on Discord for any inquiries, project discussions, or collaborations.
                </p>
                <div class="username">viromic</div>
                <div>
                    <button onclick="copyUsername()" class="copy-btn" id="copyBtn">
                        <i class="fas fa-copy"></i> Copy Username
                    </button>
                </div>
                <div>
                    <a href="index.html" class="back-btn">
                        <i class="fas fa-arrow-left"></i> Back to Portfolio
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- ═══════════════════════════════════════
         FOOTER
         ═══════════════════════════════════════ -->
    <footer class="footer" style="padding: 40px 48px 32px;">
        <div class="footer-bottom" style="border-top: none; padding-top: 0;">
            <img src="https://i.ibb.co/XfPqSFY8/1.png" alt="Dghem Signature" class="footer-signature">
            <p class="copyright">© 2026 Dghem. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
